apiVersion: apps/v1
kind: Deployment

metadata:
  name: dev-app
  namespace: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dev-app

  template:
    metadata:
      labels:
        app: dev-app

    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80